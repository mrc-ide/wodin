<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Example WODIN paper</title>
    <link rel="stylesheet" href="./wodin.css"/>
    <script>
    MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            packages: {'[+]': ['boldsymbol']}
        },
        loader: {load: ['[tex]/boldsymbol']},
    };
    </script>
    <style>
        .par-group {
            display: flex;
            justify-content: space-evenly;
        }

        .par-group .w-par {
            width: 20%;
        }
    </style>
</head>
<body>
<div class="w-sync-graphs"
     data-w-store="basic"
     w-graph-ids="1,2"
     w-sync-x-axis
     w-sync-properties="xAxisRange, logScaleYAxis"></div>

<div class="main">
    <div class="container mt-5 mb-10">
        <h1 class="mb-5">Example WODIN paper</h1>
        <div class="w-graph"
             data-w-store="oj"
             w-id="1"
             w-type="run"
             w-vars="s age 1,s age 2,s age 3"></div>
        <div class="w-graph"
             data-w-store="basic"
             w-id="1"
             w-type="run"
             w-vars="S,I"></div>
        <div class="w-par"
             w-par="beta"
             w-title="$\boldsymbol{\beta}$"
             w-desc="How infectious the disease is"
             w-min="1"
             w-max="6"
             data-w-store="basic"></div>
        <div class="w-graph"
             data-w-store="basic"
             w-id="2"
             w-type="run"
             w-vars="I,R"></div>
    </div>
</div>
<script type="module" src="./wodin.js"></script>
</body>
</html>
